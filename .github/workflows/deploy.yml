name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  # By hand from the Actions tab.
  workflow_dispatch:
  # Called by release.yml after a version bump (a GITHUB_TOKEN push does not trigger
  # the push event above), so that Release's result includes the deploy's.
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A merge and the Release workflow each start a deploy. Run at once, they take one
    # Fly machine lease each and wait for the other until both fail (#62). So they wait
    # in line: a running deploy is never cancelled (it could cut a migration or leave
    # the machines on two versions), and a newer pending deploy replaces an older one.
    # On the job, not the workflow, so that it holds the same way when called.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      # Always the latest main, not the commit that triggered this run: a deploy that
      # waited in line must never put an older version back.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A successful `flyctl deploy` doesn't prove production serves the new build
      # (#66). Compare the site's /version.json with the package.json this run just
      # deployed (retries and deadline: see the script). The app name comes from
      # fly.toml, so the host lives in one place.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check that production serves the deployed version
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'$/\1/p" fly.toml)
          : "${APP:?no app name found in fly.toml}"
          EXPECTED=$(node -p "require('./package.json').version")
          node backend/scripts/check-served-version.js \
            "https://$APP.fly.dev/version.json" "$EXPECTED"
