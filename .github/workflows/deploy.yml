name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  # Dispatched by release.yml after a version bump (a GITHUB_TOKEN push does not
  # trigger the push event above).
  workflow_dispatch:

# A merge and the Release workflow each start a deploy. Run at once, they take one Fly machine
# lease each and wait for the other until both fail (#62). So they queue, and a running deploy
# is never cancelled: that could cut a migration or leave the machines on two versions.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
