name: Release

# Cut a release from the Actions tab ("Run workflow", pick patch/minor/major).
# Bumps the version in package.json, backend/package.json and both lockfiles,
# commits it to main, tags v<version>, publishes a GitHub release whose notes are
# generated from the PRs merged since the previous tag (grouped by label, see
# .github/release.yml), then redeploys so the footer shows the new version.
#
# The bump is pushed with GITHUB_TOKEN, which by design does NOT trigger
# deploy.yml's push event, so the deploy is dispatched explicitly at the end.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          (cd backend && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin main

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v$VERSION" --target main \
            --title "🎵 Musician Tools v$VERSION" --generate-notes

      - name: Deploy the bumped version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
